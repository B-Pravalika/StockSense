<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - StockSense</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.10);
        }

        /* Logo / Title */

        .logo {
            text-align: center;

            font-size: 32px;

            font-weight: bold;

            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 15px;

            margin-bottom: 30px;
        }

        /* Error Message */

        .error {
            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 15px;

            font-weight: bold;

            color: #111827;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.10);
        }

        /* Forgot Password */

        .forgot-password {
            text-align: right;

            margin-top: -8px;

            margin-bottom: 22px;
        }

        .forgot-password a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Login Button */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        /* Signup */

        .signup-link {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 14px;
        }

        .signup-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */

        @media (max-width: 500px) {

            .login-container {
                width: calc(100% - 30px);

                padding: 30px 25px;
            }

            .logo {
                font-size: 28px;
            }
        }

    </style>

</head>


<body>

<div class="login-container">

    <!-- StockSense Logo -->

    <div class="logo">
        StockSense
    </div>


    <div class="subtitle">
        Inventory Management System
    </div>


    <!-- Error Message -->

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <!-- Login Form -->

    <form method="POST">

        {% csrf_token %}


        <!-- Username -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- Forgot Password -->

        <div class="forgot-password">

            <a href="{% url 'accounts:forgot_password' %}">
                Forgot Password?
            </a>

        </div>


        <!-- Login Button -->

        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>


    <!-- Signup Link -->

    <div class="signup-link">

        Don't have an account?

        <a href="{% url 'accounts:signup' %}">
            Create Account
        </a>

    </div>

</div>

</body>

</html>
