{% extends 'base.html' %}

{% block title %}Delete Reorder Rule{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h3 class="mb-3">
                        Delete Reorder Rule
                    </h3>

                    <p>
                        Are you sure you want to delete the reorder rule for
                        <strong>{{ rule.product.name }}</strong>
                        at
                        <strong>{{ rule.location.name }}</strong>?
                    </p>

                    <form method="post">

                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-danger">
                            Yes, Delete
                        </button>

                        <a href="{% url 'operations:reorder_rule_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
